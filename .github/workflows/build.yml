name: Build Mac + Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # Every build gets a new version: 1.1.1, 1.1.2, 1.1.3 ...
  VERSION: 1.1.${{ github.run_number }}

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow qrcode pyinstaller pywebview certifi
      - name: Stamp version into the app
        shell: bash
        run: echo "VERSION = \"$VERSION\"" > app_version.py
      - name: Make Windows icon from icon.png
        shell: bash
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --windowed --onefile
          --name "GNHS Numeracy Drill" --icon icon.ico main_desktop.py
          --hidden-import numeracy_server --hidden-import logo_data
          --hidden-import app_core --hidden-import webview
          --hidden-import app_updater --hidden-import app_version --hidden-import certifi
      - name: Name the file
        shell: bash
        run: cp "dist/GNHS Numeracy Drill.exe" GNHS-Numeracy-Drill.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Numeracy-Windows
          path: GNHS-Numeracy-Drill.exe
          if-no-files-found: error

  mac:
    name: Mac app (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow
      - name: Stamp version into the app
        run: echo "VERSION = \"$VERSION\"" > app_version.py
      - name: Make Mac icon from icon.png
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').resize((512,512), Image.LANCZOS).save('icon.icns')"
      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --windowed
          --name "GNHS Numeracy Drill" --icon icon.icns main_desktop.py
          --osx-bundle-identifier ph.gnhs.numeracy
          --hidden-import numeracy_server --hidden-import logo_data
          --hidden-import app_core --hidden-import webview
          --hidden-import app_updater --hidden-import app_version --hidden-import certifi
      - name: Package as .dmg
        run: |
          codesign --force --deep -s - "dist/GNHS Numeracy Drill.app"
          mkdir -p out
          cp -R "dist/GNHS Numeracy Drill.app" out/
          ln -s /Applications out/Applications
          hdiutil create -volname "GNHS Numeracy Drill" -srcfolder out -ov -format UDZO GNHS-Numeracy-Drill-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Numeracy-Mac
          path: GNHS-Numeracy-Drill-Mac.dmg
          if-no-files-found: error

  release:
    name: Publish a versioned release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # One release per build (v1.1.N). The apps read the newest one to find updates.
      # Stable download links keep working:
      #   .../releases/latest/download/GNHS-Numeracy-Drill.exe
      #   .../releases/latest/download/GNHS-Numeracy-Drill-Mac.dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" files/* --repo "$REPO" \
            --title "GNHS Numeracy Drill v$VERSION" \
            --notes "Windows: GNHS-Numeracy-Drill.exe  |  Mac: GNHS-Numeracy-Drill-Mac.dmg" \
            --latest

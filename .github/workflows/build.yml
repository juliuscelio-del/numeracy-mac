name: Build Teacher + Student (Mac + Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # Every build gets a new version: 1.1.1, 1.1.2, 1.1.3 ...
  VERSION: 1.1.${{ github.run_number }}

jobs:
  windows:
    name: Windows ${{ matrix.Name }} exe
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { role: teacher, Name: Teacher }
          - { role: student, Name: Student }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow qrcode pyinstaller pywebview certifi
      - name: Refresh the approved-computers list (teacher app only)
        if: matrix.role == 'teacher'
        continue-on-error: true
        run: python update_allowlist.py
      - name: Stamp version and app type into the app
        shell: bash
        run: |
          echo "VERSION = \"$VERSION\"" > app_version.py
          echo "ROLE = \"${{ matrix.role }}\"" > app_role.py
      - name: Make Windows icon from icon.png
        shell: bash
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build exe
        shell: bash
        run: |
          if [ "${{ matrix.role }}" = "teacher" ]; then
            EXTRA="--hidden-import numeracy_server --hidden-import license_check --hidden-import bundled_allowlist"
          else
            EXTRA="--exclude-module numeracy_server --exclude-module bundled_allowlist"
          fi
          python -m PyInstaller --noconfirm --windowed --onefile \
            --name "GNHS Numeracy ${{ matrix.Name }}" --icon icon.ico main_desktop.py \
            --hidden-import logo_data --hidden-import app_core --hidden-import webview \
            --hidden-import app_updater --hidden-import app_version --hidden-import app_role \
            --hidden-import certifi $EXTRA
      - name: Name the file
        shell: bash
        run: cp "dist/GNHS Numeracy ${{ matrix.Name }}.exe" "GNHS-Numeracy-${{ matrix.Name }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Numeracy-${{ matrix.Name }}-Windows
          path: GNHS-Numeracy-${{ matrix.Name }}.exe
          if-no-files-found: error

  mac:
    name: Mac ${{ matrix.Name }} app (.dmg)
    runs-on: macos-15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { role: teacher, Name: Teacher }
          - { role: student, Name: Student }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow
      - name: Refresh the approved-computers list (teacher app only)
        if: matrix.role == 'teacher'
        continue-on-error: true
        run: python update_allowlist.py
      - name: Stamp version and app type into the app
        run: |
          echo "VERSION = \"$VERSION\"" > app_version.py
          echo "ROLE = \"${{ matrix.role }}\"" > app_role.py
      - name: Make Mac icon from icon.png
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').resize((512,512), Image.LANCZOS).save('icon.icns')"
      - name: Build app
        run: |
          if [ "${{ matrix.role }}" = "teacher" ]; then
            EXTRA="--hidden-import numeracy_server --hidden-import license_check --hidden-import bundled_allowlist"
          else
            EXTRA="--exclude-module numeracy_server --exclude-module bundled_allowlist"
          fi
          python -m PyInstaller --noconfirm --windowed \
            --name "GNHS Numeracy ${{ matrix.Name }}" --icon icon.icns main_desktop.py \
            --osx-bundle-identifier ph.gnhs.numeracy.${{ matrix.role }} \
            --hidden-import logo_data --hidden-import app_core --hidden-import webview \
            --hidden-import app_updater --hidden-import app_version --hidden-import app_role \
            --hidden-import certifi $EXTRA
      - name: Package as .dmg
        run: |
          codesign --force --deep -s - "dist/GNHS Numeracy ${{ matrix.Name }}.app"
          mkdir -p out
          cp -R "dist/GNHS Numeracy ${{ matrix.Name }}.app" out/
          ln -s /Applications out/Applications
          hdiutil create -volname "GNHS Numeracy ${{ matrix.Name }}" -srcfolder out -ov -format UDZO "GNHS-Numeracy-${{ matrix.Name }}-Mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Numeracy-${{ matrix.Name }}-Mac
          path: GNHS-Numeracy-${{ matrix.Name }}-Mac.dmg
          if-no-files-found: error

  release:
    name: Publish a versioned release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # One release per build (v1.1.N) holding all four files. Each app reads the newest release and
      # downloads ONLY its own file, so the teacher app and the student app update separately.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" files/* --repo "$REPO" \
            --title "GNHS Numeracy Drill v$VERSION" \
            --notes "Teacher: GNHS-Numeracy-Teacher.exe | GNHS-Numeracy-Teacher-Mac.dmg   Student: GNHS-Numeracy-Student.exe | GNHS-Numeracy-Student-Mac.dmg" \
            --latest

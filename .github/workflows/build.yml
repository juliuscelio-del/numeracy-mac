name: Build Mac + Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow qrcode pyinstaller pywebview
      - name: Make Windows icon from icon.png
        shell: bash
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --windowed --onefile
          --name "GNHS Numeracy Drill" --icon icon.ico main_desktop.py
          --hidden-import numeracy_server --hidden-import logo_data
          --hidden-import app_core --hidden-import webview
      - name: Name the file
        shell: bash
        run: cp "dist/GNHS Numeracy Drill.exe" GNHS-Numeracy-Drill.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Numeracy-Windows
          path: GNHS-Numeracy-Drill.exe
          if-no-files-found: error

  mac:
    name: Mac app (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow
      - name: Make Mac icon from icon.png
        run: |
          python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').resize((512,512), Image.LANCZOS).save('icon.icns')"
      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --windowed
          --name "GNHS Numeracy Drill" --icon icon.icns main_desktop.py
          --osx-bundle-identifier ph.gnhs.numeracy
          --hidden-import numeracy_server --hidden-import logo_data
          --hidden-import app_core --hidden-import webview
      - name: Package as .dmg
        run: |
          codesign --force --deep -s - "dist/GNHS Numeracy Drill.app"
          mkdir -p out
          cp -R "dist/GNHS Numeracy Drill.app" out/
          ln -s /Applications out/Applications
          hdiutil create -volname "GNHS Numeracy Drill" -srcfolder out -ov -format UDZO GNHS-Numeracy-Drill-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GNHS-Numeracy-Mac
          path: GNHS-Numeracy-Drill-Mac.dmg
          if-no-files-found: error

  release:
    name: Publish plain downloads on Releases
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$REPO" >/dev/null 2>&1 || \
            gh release create latest --repo "$REPO" --title "Latest build (Mac + Windows)" \
              --notes "Windows: GNHS-Numeracy-Drill.exe  |  Mac: GNHS-Numeracy-Drill-Mac.dmg"
          gh release upload latest files/* --repo "$REPO" --clobber
